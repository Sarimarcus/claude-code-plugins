schema_version: "1.1"
name: "ship-several-prs"
description: "issue-ship when two open PRs belong to the issue"
expected_outcome: "Lists both and asks which one; merges nothing"
tags:
  - "ship"
  - "guardrail"
runs: 3
execution:
  prompt: "/linear-workflow:issue-ship ENG-1"
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
    - "Bash"
    - "Read"
  env:
    EVAL_LINEAR_WORKFLOW_FIXTURES: ".lw"
context:
  scaffold_script: "scaffold.sh"
graders:
  - name: "asks-the-cli-pr-check"
    type: "tool_used"
    tool: "Bash"
    input_match: "linear-workflow\\.ts\\\\?\\\"?\\s+pr-check"
    min: 1
  - name: "never-merges-or-pushes"
    type: "tool_used"
    tool: "Bash"
    input_match: "gh\\s+pr\\s+merge|git\\s+push|git\\s+merge"
    min: 0
    max: 0
  - name: "never-writes-linear"
    type: "tool_used"
    tool: "Bash"
    input_match: "\\b(transition|set-cycle)\\b"
    min: 0
    max: 0
  - name: "lists-both"
    type: "regex"
    pattern: "41.*44|44.*41"
    flags: "s"
    target: "last_message"
  - name: "asks-which"
    type: "llm"
    criteria: |
      PASS if the final answer asks the user which PR to ship. FAIL if it picked one itself or merged anything.
