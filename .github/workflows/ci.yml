name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Claude Code (validate and unit tests run locally, no API calls)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Type-check the CLI and shared code
        run: npx tsc -p plugins/linear-workflow/bin
      - name: Unit tests
        run: npm test
      - name: Release metadata agrees
        run: |
          for p in plugins/*/; do
            name=$(basename "$p")
            version=$(node -p "require('./$p.claude-plugin/plugin.json').version")
            node scripts/release-check.mjs "$name-v$version" > /dev/null
          done
